[project]
name = "grossy"
version = "0.2.0"
description = "Deterministic CLI for weekly grocery shopping automation on AB.gr"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0.2",
    "typer>=0.12",
]

[project.scripts]
grossy = "grossy.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "types-PyYAML>=6",
]

# NOTE: Dependency versions are owned by flake.nix (Nixpkgs pin).
# This section documents minimum compatibility for the package metadata.
# The Nix development shell is the authoritative execution environment.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"grossy" = ["migrations/*.sql"]
"grossy.recipes" = ["seed_fixtures/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "src"
packages = ["grossy"]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
