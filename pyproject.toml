[project]
name = "grossy"
version = "0.1.0"
description = "Deterministic CLI for weekly grocery shopping automation on AB.gr"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0.2",
    # Pinned below the typer 0.16+ rewrite: the 0.15 line keeps the stable
    # Click-based command tree and typer.testing.CliRunner used by the tests.
    "typer>=0.12,<0.16",
]

[project.scripts]
grossy = "grossy.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.5",
    "types-PyYAML>=6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "src"
packages = ["grossy"]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
